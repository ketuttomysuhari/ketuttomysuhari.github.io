<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cesium Tileset Focus Viewer</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-panel: rgba(13, 18, 30, 0.88);
      --border-panel: rgba(255, 255, 255, 0.10);
      --text-main: #ffffff;
      --text-soft: #cfd8e3;
      --primary: #4da3ff;
      --success: #10b981;
      --sunny: #ff9f43;
      --rain: #4b7bec;
      --fog: #95a5a6;
      --dark: #1f2937;
      --shadow: 0 12px 30px rgba(0,0,0,0.30);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      background: #0c1220;
      -webkit-tap-highlight-color: transparent;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    #weatherCanvas {
      position: absolute;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      top: calc(16px + var(--safe-top));
      left: 16px;
      z-index: 100;
      width: 360px;
      max-width: calc(100vw - 32px);
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border-panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
      transition: all .28s ease;
    }

    .panel.collapsed .panel-body {
      display: none;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .panel.collapsed .panel-header {
      border-bottom: none;
    }

    .panel-title h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    .panel-title p {
      margin: 5px 0 0;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-soft);
    }

    .toggle-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 18px;
      flex-shrink: 0;
    }

    .panel-body {
      padding: 14px;
    }

    .weather-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 12px;
    }

    .weather-left .label {
      font-size: 11px;
      color: var(--text-soft);
      margin-bottom: 4px;
    }

    .weather-left .temp {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .weather-right {
      text-align: right;
      font-size: 12px;
      line-height: 1.4;
      color: #ffe39b;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-soft);
      margin: 12px 0 8px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button.action-btn {
      border: none;
      border-radius: 12px;
      min-height: 46px;
      padding: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: .2s ease;
      color: white;
    }

    button.action-btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-sunny { background: var(--sunny); }
    .btn-rain { background: var(--rain); }
    .btn-fog { background: var(--fog); }
    .btn-dark { background: var(--dark); }
    .btn-wide { grid-column: span 2; }

    .status-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-soft);
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(77,163,255,0.18);
      color: #dbeafe;
    }

    .bottom-info {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      line-height: 1.55;
      color: var(--text-soft);
    }

    .chip {
      position: absolute;
      top: calc(16px + var(--safe-top));
      right: 16px;
      z-index: 99;
      background: rgba(13,18,30,0.82);
      color: white;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 12px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      max-width: calc(100vw - 32px);
    }

    .chip strong {
      color: #93c5fd;
    }

    @media (max-width: 992px) {
      .panel {
        width: 320px;
      }
    }

    @media (max-width: 768px) {
      .panel {
        top: auto;
        left: 10px;
        right: 10px;
        bottom: calc(10px + var(--safe-bottom));
        width: auto;
        max-width: none;
        border-radius: 20px;
      }

      .panel-body {
        max-height: 52vh;
        overflow-y: auto;
      }

      .panel-title h2 {
        font-size: 15px;
      }

      .panel-title p {
        font-size: 11px;
      }

      .weather-left .temp {
        font-size: 22px;
      }

      .weather-right {
        font-size: 11px;
      }

      .chip {
        top: calc(10px + var(--safe-top));
        left: 10px;
        right: 10px;
        width: auto;
        text-align: center;
        font-size: 11px;
        padding: 8px 10px;
      }
    }

    @media (max-width: 480px) {
      .panel {
        left: 8px;
        right: 8px;
        bottom: calc(8px + var(--safe-bottom));
      }

      .panel-body {
        max-height: 48vh;
      }

      .btn-grid {
        grid-template-columns: 1fr;
      }

      .btn-wide {
        grid-column: span 1;
      }

      .weather-box {
        flex-direction: column;
        align-items: flex-start;
      }

      .weather-right {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <canvas id="weatherCanvas"></canvas>

  <div class="panel" id="controlPanel">
    <div class="panel-header">
      <div class="panel-title">
        <h2>Cesium Smart Viewer</h2>
        <p>Fokus asset 4515285 + layer tambahan OSM Buildings.</p>
      </div>
      <button class="toggle-btn" id="panelToggle" type="button">☰</button>
    </div>

    <div class="panel-body">
      <div class="weather-box">
        <div class="weather-left">
          <div class="label">Suhu</div>
          <div class="temp" id="tempValue">22°C</div>
        </div>
        <div class="weather-right" id="weatherCondition">
          Berawan<br>Tileset Area
        </div>
      </div>

      <div class="section-title">Kontrol tampilan</div>
      <div class="btn-grid">
        <button class="action-btn btn-sunny" id="btnSunny" type="button">☀️ Panas</button>
        <button class="action-btn btn-rain" id="btnRain" type="button">🌧️ Hujan</button>
        <button class="action-btn btn-fog" id="btnFog" type="button">🌫️ Kabut</button>

        <button class="action-btn btn-primary" id="btnMainTileset" type="button">🧱 Asset Utama</button>
        <button class="action-btn btn-success" id="btnBuildings" type="button">🏢 OSM Buildings</button>

        <button class="action-btn btn-success" id="btnHome" type="button">📍 Fokus Tileset</button>
        <button class="action-btn btn-dark" id="btnReset" type="button">↺ Reset</button>

        <button class="action-btn btn-dark btn-wide" id="btnZoomTileset" type="button">🎯 Zoom ke Tileset</button>
      </div>

      <div class="status-box" id="statusBox">
        Viewer siap.
        <div class="badge" id="activeModeBadge">Mode: Default</div>
      </div>

      <div class="bottom-info">
        Asset utama: <strong>4515285</strong><br>
        Layer tambahan: <strong>Cesium OSM Buildings</strong><br>
        Klik bangunan untuk melihat atribut jika tersedia.
      </div>
    </div>
  </div>

  <div class="chip" id="floatingChip">
    Target: <strong>Tileset 4515285</strong>
  </div>

  <script type="module">
    Cesium.Ion.defaultAccessToken =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJjOWRmOThmYS1iYjhiLTQ4YzgtOTAzMC1hYjE5OGZmZDExMGUiLCJpZCI6MjUyMDkzLCJpYXQiOjE3MzA0MTMxMzB9.oiJJytiAc-uPwL9DTfzg-iulsz8DixZOtWrbtO1K9rI";

    const controlPanel = document.getElementById("controlPanel");
    const panelToggle = document.getElementById("panelToggle");
    const tempValueEl = document.getElementById("tempValue");
    const weatherConditionEl = document.getElementById("weatherCondition");
    const statusBoxEl = document.getElementById("statusBox");
    const activeModeBadgeEl = document.getElementById("activeModeBadge");
    const floatingChipEl = document.getElementById("floatingChip");

    const isMobile = window.innerWidth <= 768;

    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      animation: false,
      timeline: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: true,
      navigationHelpButton: true,
      baseLayerPicker: true,
      infoBox: true,
      selectionIndicator: true,
      shouldAnimate: true
    });

    const scene = viewer.scene;

    scene.globe.depthTestAgainstTerrain = false;
    scene.screenSpaceCameraController.enableCollisionDetection = true;
    scene.screenSpaceCameraController.enableTilt = true;
    scene.screenSpaceCameraController.enableZoom = true;
    scene.screenSpaceCameraController.enableRotate = true;
    scene.screenSpaceCameraController.enableTranslate = true;
    scene.skyAtmosphere.show = true;
    scene.fog.enabled = false;
    viewer.resolutionScale = Math.min(window.devicePixelRatio, isMobile ? 1.2 : 1.5);

    let weatherMode = "default";
    let mainTileset = null;
    let buildingTileset = null;
    let tilesetVisible = true;
    let osmBuildingsVisible = true;

    function setStatus(message, modeText = null) {
      statusBoxEl.innerHTML = `
        ${message}
        <div class="badge">${modeText || activeModeBadgeEl.textContent}</div>
      `;
    }

    function updateModeBadge(text) {
      activeModeBadgeEl.textContent = text;
    }

    function updateFloatingChip(text) {
      floatingChipEl.innerHTML = `Target: <strong>${text}</strong>`;
    }

    function clearWeatherCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function focusToMainTileset(duration = 2.2) {
      if (!mainTileset) return;

      const sphere = mainTileset.boundingSphere;
      const range = Math.max(sphere.radius * 2.2, 180);

      viewer.camera.flyToBoundingSphere(sphere, {
        duration,
        offset: new Cesium.HeadingPitchRange(
          0.0,
          Cesium.Math.toRadians(-28),
          range
        )
      });

      updateFloatingChip("Tileset 4515285");
      setStatus("Kamera difokuskan ke asset 4515285.", "Mode: Tileset");
    }

    const canvas = document.getElementById("weatherCanvas");
    const ctx = canvas.getContext("2d");
    let rainDrops = [];

    function resizeWeatherCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initRain() {
      rainDrops = [];
      const dropCount = window.innerWidth <= 768 ? 120 : 260;
      for (let i = 0; i < dropCount; i++) {
        rainDrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          len: 10 + Math.random() * 18,
          speed: 4 + Math.random() * 8
        });
      }
    }

    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(180,220,255,0.70)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();

      for (const d of rainDrops) {
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 3, d.y + d.len);
        d.y += d.speed;
        d.x -= 0.35;

        if (d.y > canvas.height + 10) {
          d.y = -20;
          d.x = Math.random() * canvas.width;
        }
        if (d.x < -20) {
          d.x = canvas.width + 20;
        }
      }

      ctx.stroke();
    }

    function animateWeather() {
      if (weatherMode === "rain") {
        drawRain();
      } else {
        clearWeatherCanvas();
      }
      requestAnimationFrame(animateWeather);
    }

    function setSunnyMode() {
      weatherMode = "sunny";
      clearWeatherCanvas();

      scene.fog.enabled = false;
      scene.skyAtmosphere.hueShift = 0.0;
      scene.skyAtmosphere.saturationShift = 0.15;
      scene.skyAtmosphere.brightnessShift = 0.08;

      tempValueEl.textContent = "31°C";
      weatherConditionEl.innerHTML = "Panas / Cerah<br>Tileset Area";
      updateModeBadge("Mode: Panas");
      setStatus("Efek panas diaktifkan.", "Mode: Panas");
    }

    function setRainMode() {
      weatherMode = "rain";
      initRain();

      scene.fog.enabled = true;
      scene.fog.density = isMobile ? 0.0012 : 0.0018;
      scene.fog.minimumBrightness = 0.35;
      scene.skyAtmosphere.hueShift = -0.2;
      scene.skyAtmosphere.saturationShift = -0.4;
      scene.skyAtmosphere.brightnessShift = -0.25;

      tempValueEl.textContent = "24°C";
      weatherConditionEl.innerHTML = "Hujan<br>Tileset Area";
      updateModeBadge("Mode: Hujan");
      setStatus("Efek hujan diaktifkan.", "Mode: Hujan");
    }

    function setFogMode() {
      weatherMode = "fog";
      clearWeatherCanvas();

      scene.fog.enabled = true;
      scene.fog.density = isMobile ? 0.0025 : 0.004;
      scene.fog.minimumBrightness = 0.2;
      scene.skyAtmosphere.hueShift = 0.0;
      scene.skyAtmosphere.saturationShift = -0.7;
      scene.skyAtmosphere.brightnessShift = -0.35;

      tempValueEl.textContent = "22°C";
      weatherConditionEl.innerHTML = "Berkabut<br>Tileset Area";
      updateModeBadge("Mode: Kabut");
      setStatus("Efek kabut diaktifkan.", "Mode: Kabut");
    }

    function resetView() {
      weatherMode = "default";
      clearWeatherCanvas();

      scene.fog.enabled = false;
      scene.skyAtmosphere.hueShift = 0.0;
      scene.skyAtmosphere.saturationShift = 0.0;
      scene.skyAtmosphere.brightnessShift = 0.0;

      tempValueEl.textContent = "22°C";
      weatherConditionEl.innerHTML = "Berawan<br>Tileset Area";
      updateModeBadge("Mode: Default");
      setStatus("Tampilan kembali ke default.", "Mode: Default");
    }

    async function loadMainTileset() {
      setStatus("Memuat asset Ion 4515285...", "Mode: Loading");

      mainTileset = await Cesium.Cesium3DTileset.fromIonAssetId(4515285, {
        maximumScreenSpaceError: 8,
        skipLevelOfDetail: true,
        preferLeaves: true,
        dynamicScreenSpaceError: true
      });

      mainTileset.show = true;
      viewer.scene.primitives.add(mainTileset);

      if (mainTileset.tileFailed) {
        mainTileset.tileFailed.addEventListener((error) => {
          console.error("Main tileset tile failed:", error);
        });
      }

      await viewer.zoomTo(mainTileset);
      focusToMainTileset(0.5);

      setStatus("Asset 4515285 berhasil dimuat.", "Mode: Ready");
      updateFloatingChip("Tileset 4515285");
    }

    async function loadOsmBuildings() {
      setStatus("Memuat OSM Buildings...", "Mode: Loading OSM");

      buildingTileset = await Cesium.createOsmBuildingsAsync();

      buildingTileset.style = new Cesium.Cesium3DTileStyle({
        color: "color('white', 0.45)"
      });

      buildingTileset.show = true;
      viewer.scene.primitives.add(buildingTileset);

      if (buildingTileset.tileFailed) {
        buildingTileset.tileFailed.addEventListener((error) => {
          console.error("OSM Buildings tile failed:", error);
        });
      }

      setStatus(
        "OSM Buildings berhasil dimuat sebagai layer tambahan.",
        "Mode: OSM Ready"
      );
    }

    function formatPickedProperties(picked) {
      const tryGet = (name) => {
        try {
          return picked.getProperty ? picked.getProperty(name) : undefined;
        } catch (e) {
          return undefined;
        }
      };

      return {
        name:
          tryGet("name") ||
          tryGet("building") ||
          tryGet("addr:street") ||
          tryGet("cesium#displayName") ||
          "Objek 3D",
        id:
          tryGet("id") ||
          tryGet("elementId") ||
          tryGet("objectid") ||
          tryGet("gml_id") ||
          tryGet("fid") ||
          "-",
        building:
          tryGet("building") ||
          tryGet("elementType") ||
          "-",
        height:
          tryGet("height") ||
          tryGet("cesium#estimatedHeight") ||
          "-",
        street:
          tryGet("addr:street") || "-",
        levels:
          tryGet("building:levels") || "-",
        color:
          tryGet("cesium#color") || "-"
      };
    }

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function (movement) {
      const picked = viewer.scene.pick(movement.position);

      if (!Cesium.defined(picked) || !picked.getProperty) return;

      const props = formatPickedProperties(picked);

      viewer.selectedEntity = new Cesium.Entity({
        name: "Informasi Objek 3D",
        description: `
          <table style="width:100%; border-collapse:collapse;">
            <tr><td><b>Nama</b></td><td>${props.name}</td></tr>
            <tr><td><b>ID</b></td><td>${props.id}</td></tr>
            <tr><td><b>Tipe</b></td><td>${props.building}</td></tr>
            <tr><td><b>Tinggi</b></td><td>${props.height}</td></tr>
            <tr><td><b>Levels</b></td><td>${props.levels}</td></tr>
            <tr><td><b>Alamat</b></td><td>${props.street}</td></tr>
            <tr><td><b>Color</b></td><td>${props.color}</td></tr>
          </table>
        `
      });
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    panelToggle.addEventListener("click", () => {
      controlPanel.classList.toggle("collapsed");
    });

    document.getElementById("btnSunny").addEventListener("click", setSunnyMode);
    document.getElementById("btnRain").addEventListener("click", setRainMode);
    document.getElementById("btnFog").addEventListener("click", setFogMode);

    document.getElementById("btnMainTileset").addEventListener("click", () => {
      if (!mainTileset) return;

      tilesetVisible = !tilesetVisible;
      mainTileset.show = tilesetVisible;

      setStatus(
        `Asset 4515285 sekarang <b>${tilesetVisible ? "aktif" : "disembunyikan"}</b>.`,
        "Mode: Layer Asset"
      );
    });

    document.getElementById("btnBuildings").addEventListener("click", () => {
      if (!buildingTileset) return;

      osmBuildingsVisible = !osmBuildingsVisible;
      buildingTileset.show = osmBuildingsVisible;

      setStatus(
        `OSM Buildings sekarang <b>${osmBuildingsVisible ? "aktif" : "nonaktif"}</b>.`,
        "Mode: Layer OSM"
      );
    });

    document.getElementById("btnHome").addEventListener("click", () => {
      focusToMainTileset();
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      resetView();
      focusToMainTileset();
    });

    document.getElementById("btnZoomTileset").addEventListener("click", async () => {
      if (!mainTileset) return;

      await viewer.zoomTo(mainTileset);
      updateFloatingChip("Tileset 4515285");
      setStatus("Kamera diarahkan ke keseluruhan tileset.", "Mode: Tileset");
    });

    resizeWeatherCanvas();
    window.addEventListener("resize", resizeWeatherCanvas);

    async function initViewer() {
      try {
        resetView();
        animateWeather();

        await loadMainTileset();
        await loadOsmBuildings();

        setStatus(
          "Viewer siap. Asset 4515285 dan OSM Buildings aktif.",
          "Mode: Ready"
        );

        if (isMobile) {
          controlPanel.classList.add("collapsed");
        }
      } catch (err) {
        console.error(err);
        setStatus(
          "Gagal memuat viewer. Cek token, asset ion, atau koneksi internet.",
          "Mode: Error"
        );
      }
    }

    initViewer();
  </script>
</body>
</html>
